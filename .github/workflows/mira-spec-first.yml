name: Mira Spec First

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate Mira specification
    runs-on: ubuntu-latest
    steps:
      - name: Check out the pull request
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install mdBook
        uses: taiki-e/install-action@v2
        with:
          tool: mdbook@0.5.4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate canonical specification
        run: pnpm spec:lint && pnpm spec:validate && pnpm spec:build && pnpm spec:test

      - name: Enforce specification-first changes
        run: >-
          pnpm spec:first --
          --base "${{ github.event.pull_request.base.sha }}"
          --head "${{ github.event.pull_request.head.sha }}"
