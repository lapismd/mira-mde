name: Mira CI

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: mira-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MIRA_VALIDATION_RUNTIME: native
  LAPIS_CI_EVENT: ${{ github.event_name }}
  LAPIS_CI_PR_AUTHOR: ${{ github.event.pull_request.user.login }}
  LAPIS_CI_PR_AUTHOR_TYPE: ${{ github.event.pull_request.user.type }}
  LAPIS_CI_PR_HEAD: ${{ github.event.pull_request.head.ref }}
  LAPIS_DEPENDENCY_BOT_LOGIN: ${{ vars.LAPIS_DEPENDENCY_BOT_LOGIN }}

jobs:
  governance:
    name: Specification and release intent
    runs-on: ubuntu-latest
    steps:
      - name: Check out the exact change set
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install mdBook
        uses: taiki-e/install-action@v2
        with:
          tool: mdbook@0.5.4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate canonical specification
        run: pnpm spec:validate && pnpm spec:build

      - name: Enforce specification-first changes
        if: >-
          (github.event_name == 'pull_request' && github.head_ref != 'changeset-release/main') && !(github.event.pull_request.user.type == 'Bot' && (contains(fromJSON('["dependabot[bot]","renovate[bot]","lapismd-dependency-bot[bot]"]'), github.event.pull_request.user.login) || (vars.LAPIS_DEPENDENCY_BOT_LOGIN != '' && github.event.pull_request.user.login == vars.LAPIS_DEPENDENCY_BOT_LOGIN)))
        run: >-
          pnpm spec:first --base "${{ github.event.pull_request.base.sha }}" --head "${{ github.event.pull_request.head.sha }}"

      - name: Enforce public package release intent
        if: >-
          github.event_name == 'pull_request' && github.head_ref != 'changeset-release/main'
        run: >-
          pnpm release:intent -- --base "${{ github.event.pull_request.base.sha }}" --head "${{ github.event.pull_request.head.sha }}"

  packages:
    name: Packages and repository gates
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate catalog and package contracts
        run: pnpm catalog:check && pnpm packages:check

      - name: Audit dependencies
        run: pnpm audit

      - name: Install checksum-verified Jujutsu for runner regressions
        run: node scripts/validation/install-tools.mjs --ci

      - name: Run full non-browser validation
        run: pnpm check:all

      - name: Install Chromium for packed hosts
        run: pnpm exec playwright install --with-deps chromium

      - name: Validate packed public consumers
        run: pnpm packages:pack

      - name: Retain packed production audit evidence
        if: always() && hashFiles('.release/*-audit.json', '.release/math-*-compile-diagnostics.json') != ''
        uses: actions/upload-artifact@v7
        with:
          name: mira-packed-audit-${{ github.sha }}
          path: |
            .release/production-consumer-audit.json
            .release/base-math-production-audit.json
            .release/mermaid-runtime-identity.json
            .release/math-development-compile-diagnostics.json
            .release/math-production-compile-diagnostics.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  storybook:
    name: Storybook build and browser acceptance
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Build static Storybook
        run: pnpm build-storybook

      - name: Run Storybook interactions and accessibility
        if: ${{ !cancelled() }}
        run: pnpm test:storybook

      - name: Run Storybook acceptance
        if: ${{ !cancelled() }}
        run: pnpm test:e2e
