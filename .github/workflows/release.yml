name: Release public packages

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the reviewed artifact after exact-source approval
        required: true
        default: false
        type: boolean
      source_commit:
        description: Optional immutable source commit already merged into main
        required: false
        default: ""
        type: string
      package_versions:
        description: Exact package versions as a JSON array, required for a historical source
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: mira-public-release
  cancel-in-progress: false

env:
  MIRA_VALIDATION_RUNTIME: native
  MIRA_RELEASE_SOURCE: ${{ inputs.source_commit || github.sha }}

jobs:
  version:
    name: Update Version Packages pull request
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      has_changesets: ${{ steps.changesets.outputs.hasChangesets || 'false' }}
    steps:
      - name: Check out main
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create or update Version Packages pull request
        id: changesets
        if: github.event_name == 'push'
        uses: changesets/action@v1.8.0
        with:
          version: pnpm release:version
          commit: Version public packages
          title: Version Packages
          commitMode: github-api
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  artifact:
    name: Build verified release artifact
    needs: version
    if: needs.version.outputs.has_changesets != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      artifact_name: ${{ steps.mode.outputs.artifact_name }}
      source_commit: ${{ steps.source.outputs.commit }}
      bootstrap_required: ${{ steps.mode.outputs.bootstrap_required }}
      package_count: ${{ steps.mode.outputs.package_count }}
      should_publish: ${{ steps.mode.outputs.should_publish }}
    steps:
      - name: Check out release workflow tooling
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate requested main source and exact version scope
        id: source
        env:
          MIRA_REQUESTED_SOURCE: ${{ inputs.source_commit || '' }}
          MIRA_EXPECTED_VERSIONS: ${{ inputs.package_versions || '' }}
        run: |
          node scripts/check-release-source.mjs source
          cp scripts/check-release-source.mjs "$RUNNER_TEMP/mira-check-release-source.mjs"

      - name: Check out the exact validated release source
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.source.outputs.commit }}
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install mdBook
        uses: taiki-e/install-action@v2
        with:
          tool: mdbook@0.5.4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Require the public canonical repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: test "$(gh api "repos/${GITHUB_REPOSITORY}" --jq .visibility)" = public

      - name: Install checksum-verified Jujutsu for runner regressions
        run: node scripts/validation/install-tools.mjs --ci

      - name: Install Chromium for packed hosts
        run: pnpm exec playwright install --with-deps chromium

      - name: Revalidate release source
        run: |
          export GITHUB_SHA="$MIRA_RELEASE_SOURCE"
          pnpm spec:check
          pnpm catalog:check
          pnpm packages:check
          pnpm audit
          pnpm check:all
          pnpm packages:pack

      - name: Retain packed production audit evidence
        if: always() && hashFiles('.release/*-audit.json', '.release/math-*-compile-diagnostics.json') != ''
        uses: actions/upload-artifact@v7
        with:
          name: mira-packed-audit-${{ github.sha }}
          path: |
            .release/production-consumer-audit.json
            .release/base-math-production-audit.json
            .release/mermaid-runtime-identity.json
            .release/math-development-compile-diagnostics.json
            .release/math-production-compile-diagnostics.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

      - name: Plan exact unpublished versions
        run: GITHUB_SHA="$MIRA_RELEASE_SOURCE" pnpm release:plan

      - name: Select protected publication mode
        id: mode
        env:
          MIRA_PUBLISH_REQUESTED: ${{ github.event_name == 'workflow_dispatch' && inputs.publish == true }}
          MIRA_RELEASE_EXPECTED_VERSIONS: ${{ steps.source.outputs.versions }}
        run: |
          node "$RUNNER_TEMP/mira-check-release-source.mjs" selection .release/release-plan.json
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from "node:fs";
          const plan = JSON.parse(readFileSync(".release/release-plan.json", "utf8"));
          if (process.env.GITHUB_REF !== "refs/heads/main") {
            throw new Error("Releases must run from refs/heads/main");
          }
          const shouldPublish = process.env.MIRA_PUBLISH_REQUESTED === "true" &&
            plan.selected.length > 0 && !plan.bootstrapRequired;
          const output = [
            `artifact_name=mira-release-${process.env.MIRA_RELEASE_SOURCE}`,
            `bootstrap_required=${plan.bootstrapRequired}`,
            `package_count=${plan.selected.length}`,
            `should_publish=${shouldPublish}`,
          ].join("\n");
          appendFileSync(process.env.GITHUB_OUTPUT, `${output}\n`);
          if (plan.bootstrapRequired && plan.selected.length > 0) {
            console.log("::notice::Initial packages require manual npm publication from the verified release artifact.");
          }
          NODE

      - name: Prepare immutable package tarballs
        if: steps.mode.outputs.package_count != '0'
        run: GITHUB_SHA="$MIRA_RELEASE_SOURCE" pnpm release:prepare

      - name: Upload verified release artifact
        if: steps.mode.outputs.package_count != '0'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.mode.outputs.artifact_name }}
          path: |
            .release/release-manifest.json
            .release/tarballs/*.tgz
            .release/production-consumer-audit.json
            .release/base-math-production-audit.json
            .release/mermaid-runtime-identity.json
            .release/math-development-compile-diagnostics.json
            .release/math-production-compile-diagnostics.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  publish-production:
    name: Publish with npm trusted publishing
    needs: artifact
    if: >-
      needs.artifact.outputs.should_publish == 'true' && needs.artifact.outputs.bootstrap_required == 'false'
    runs-on: ubuntu-latest
    environment:
      name: npm-production
    env:
      MIRA_RELEASE_SOURCE_ROOT: ${{ github.workspace }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out the release commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.artifact.outputs.source_commit }}

      - name: Check out reviewed publication tooling
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: .release/tooling

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies and current npm
        run: |
          pnpm install --frozen-lockfile
          npm install --global npm@12.0.2

      - name: Download verified tarballs
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.artifact.outputs.artifact_name }}
          path: .release

      - name: Publish exact verified tarballs
        env:
          MIRA_RELEASE_APPROVED: "1"
          MIRA_PUBLISH_REQUESTED: ${{ github.event_name == 'workflow_dispatch' && inputs.publish == true }}
          MIRA_RELEASE_APPROVED_SOURCE: ${{ vars.MIRA_RELEASE_APPROVED_SOURCE }}
        run: pnpm --dir .release/tooling release:publish "$GITHUB_WORKSPACE/.release/release-manifest.json"

  verify:
    name: Verify installed packages and provenance
    needs:
      - artifact
      - publish-production
    if: >-
      always() && needs.artifact.outputs.should_publish == 'true' && needs.publish-production.result == 'success'
    runs-on: ubuntu-latest
    env:
      MIRA_RELEASE_SOURCE_ROOT: ${{ github.workspace }}
    permissions:
      contents: read
    steps:
      - name: Check out the release commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.artifact.outputs.source_commit }}

      - name: Check out reviewed publication tooling
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: .release/tooling

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies and current npm
        run: |
          pnpm install --frozen-lockfile
          npm install --global npm@12.0.2

      - name: Download verified tarballs
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.artifact.outputs.artifact_name }}
          path: .release

      - name: Verify clean install, integrity, and provenance
        run: >-
          pnpm --dir .release/tooling release:verify "$GITHUB_WORKSPACE/.release/release-manifest.json" "$GITHUB_WORKSPACE/.release/npm-signatures.json"

      - name: Retain npm signature evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: npm-signatures-${{ github.sha }}
          path: .release/npm-signatures.json
          if-no-files-found: warn
          retention-days: 90

  notes:
    name: Create package tags and GitHub releases
    needs:
      - artifact
      - verify
    if: needs.verify.result == 'success'
    runs-on: ubuntu-latest
    env:
      MIRA_RELEASE_SOURCE_ROOT: ${{ github.workspace }}
    permissions:
      contents: write
    steps:
      - name: Check out the release commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.artifact.outputs.source_commit }}

      - name: Check out reviewed publication tooling
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: .release/tooling

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download verified release manifest
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.artifact.outputs.artifact_name }}
          path: .release

      - name: Create retry-safe package releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm --dir .release/tooling release:notes "$GITHUB_WORKSPACE/.release/release-manifest.json"
  notify-dependencies:
    name: Notify dependency consumers
    needs:
      - artifact
      - verify
    if: always() && needs.verify.result == 'success'
    permissions:
      contents: read
    uses: lapismd/dependency-automation/.github/workflows/notify.yml@ea9d35b12b612467bbabf1c6271ffa41b5eda4ba
    with:
      automation-ref: ea9d35b12b612467bbabf1c6271ffa41b5eda4ba
      source-sha: ${{ needs.artifact.outputs.source_commit }}
    secrets:
      app-private-key: ${{ secrets.LAPIS_DEPENDENCY_APP_PRIVATE_KEY }}
